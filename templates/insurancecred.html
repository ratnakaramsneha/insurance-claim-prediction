<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Healthcare Login</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #ffffff;
      color: #333;
      display: flex;
      height: 100vh;
    }

    .container {
      display: flex;
      flex: 1;
      padding: 40px;
    }

    .left, .right {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 20px;
    }

    .left {
      background: #f9fdfc;
    }

    .left h1 {
      font-size: 48px;
      margin: 0;
    }

    .left h2 {
      font-size: 36px;
      color: #23c586;
      margin: 10px 0;
    }

    .left p {
      color: #aaa;
      font-size: 16px;
      max-width: 400px;
    }

    .left img {
      max-width: 100%;
      height: auto;
      margin-top: 40px;
    }

    .right h2 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .right form {
      display: flex;
      flex-direction: column;
      max-width: 300px;
    }

    .right input[type="text"],
    .right input[type="password"] {
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .right button {
      padding: 10px;
      border: none;
      border-radius: 4px;
      background-color: #23c586;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .right .signup {
      background-color: transparent;
      color: #23c586;
      border: 1px solid #23c586;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left">
      <h1>Trends</h1>
      <h2>Healthcare</h2>
      <p>Discover affordable, reliable health insurance solutions tailored to your needs. Your health, our priority—protect your future today.</p>
      <img src="https://tezo.com/wp-content/uploads/2023/06/Health-Insurance-Claims-Analytics.webp" alt="Healthcare illustration">
    </div>

    <div class="right">
      <h2>Healthcare</h2>
      <p>Welcome back! Please login to your account.</p>

      <!-- ✅ Corrected FORM to submit to Flask -->
      <form id="loginForm" action="/login" method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
        <button type="button" class="signup">Sign up</button>
      </form>

    </div>
  </div>
  {% if error %}
<script>
  Swal.fire({
    icon: 'error',
    title: 'Login Failed',
    text: '{{ error }}'
  });
</script>
{% endif %}


  <!-- ❌ Remove JS checking username/password manually -->
</body>
</html>
